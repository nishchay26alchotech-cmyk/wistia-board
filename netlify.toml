# Netlify serves the board from the docs folder and runs the live function in netlify/functions.
# The slow-changing numbers (plays, loads, errors) come from the GitHub feed, so Netlify only rebuilds when the page,
# the live function or this file changes.
[build]
  publish = "docs"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs/index.html netlify.toml netlify/ wistia-lib.mjs"

[functions]
  directory = "netlify/functions"
